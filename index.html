<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Claim your Halloween Treat</title>
<style>
  :root { --bg:#0b0b0f; --accent:#ff8b3b; --muted:#bdbdbd; }
  html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:#eee}
  .wrap {display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;box-sizing:border-box;}
  .card {width:100%;max-width:720px;background:linear-gradient(180deg,#0f0f12, #070708);border-radius:14px;padding:28px;box-shadow:0 18px 60px rgba(0,0,0,.7);text-align:center}
  h1{margin:0 0 6px 0;font-size:28px}
  p.lead{margin:0 0 16px;color:var(--muted)}
  .btn {background:var(--accent);border:none;padding:12px 22px;border-radius:10px;font-size:18px;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.5);color:#111;transition:transform 0.2s}
  .btn:hover{transform:scale(1.05)}
  .btn:active{transform:scale(0.98)}
  .small{font-size:13px;color:var(--muted);margin-top:10px}
  
  /* verification screen */
  #verifyScreen{display:none;flex-direction:column;gap:18px;align-items:center}
  .progressWrap{width:100%;background:rgba(255,255,255,0.04);border-radius:12px;padding:6px;box-sizing:border-box}
  .bar{height:18px;border-radius:8px;width:0%;background:linear-gradient(90deg,#ff3b3b,#ff8b3b);transition:width .25s linear}
  .status{font-family:monospace;color:#ffd7c4}
  
  /* full-screen scare */
  #scareFull{display:none;position:fixed;inset:0;z-index:999;background:black;align-items:center;justify-content:center;overflow:hidden}
  #scareFull img{max-width:100vw;max-height:100vh;object-fit:contain;background:black;display:block;transform:scale(1);transition:transform .4s ease;}
  .shake{animation:shake .6s ease-in-out 2}
  @keyframes shake {0%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}100%{transform:translateX(0)}}
  .glow {box-shadow:0 0 160px rgba(255,100,80,.12) inset}
  .overlayText{position:absolute;left:0;right:0;bottom:10vh;text-align:center;color:#fff;font-size:22px;text-shadow:0 6px 30px rgba(0,0,0,.6)}
  
  /* responsive */
  @media (max-width:520px){ .card{padding:18px} h1{font-size:22px} .btn{font-size:16px} }
</style>
</head>
<body>

<!-- Landing card -->
<div class="wrap" id="landingWrap">
  <div class="card" id="landingCard">
    <h1>🎃 Free Halloween Treat!</h1>
    <p class="lead">Scanned the QR? Tap below to claim your candy. (No download — just a quick verification.)</p>
    <button class="btn" id="claimBtn">Claim Now</button>
    <div class="small">Tip: This works on phones — tap to begin the verification.</div>
  </div>
</div>

<!-- Verification card -->
<div class="wrap" id="verifyWrap" style="display:none">
  <div class="card" id="verifyCard">
    <h1 style="font-size:22px;margin-bottom:6px">Verifying your request...</h1>
    <div class="progressWrap" aria-hidden="true">
      <div class="bar" id="progressBar"></div>
    </div>
    <div class="status" id="statusText">Initializing 0%</div>
    <p class="small">This process takes a few seconds. Please don't close the page.</p>
  </div>
</div>

<!-- Full-screen scare -->
<div id="scareFull">
  <img id="scareImg" src="https://i.imgur.com/5fZ5Z5Z.gif" alt="scare" style="display:none">
  <div class="overlayText" id="overlayText"></div>
</div>

<script>
  // ---- configuration ----
  // Using a hosted scream audio (public domain horror sound)
  const SCREAM_AUDIO = "jumpscare.mp3";
  // Using a creepy image - replace with your own hosted image
  const IMAGE_URL = "scare.gif";

  // elements
  const claimBtn = document.getElementById('claimBtn');
  const landingWrap = document.getElementById('landingWrap');
  const verifyWrap = document.getElementById('verifyWrap');
  const progressBar = document.getElementById('progressBar');
  const statusText = document.getElementById('statusText');
  const scareFull = document.getElementById('scareFull');
  const scareImg = document.getElementById('scareImg');
  const overlayText = document.getElementById('overlayText');

  // Set image source
  scareImg.src = IMAGE_URL;

  // preload audio - create on user interaction
  let audio = null;

  // messages to show during "verification"
  const verifyMessages = [
    "Checking candy balance...",
    "Scanning for ghosts...",
    "Confirming age (older than 7)...",
    "Finalizing your treat..."
  ];

  function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }

  claimBtn.addEventListener('click', async () => {
    // Initialize audio on first user interaction (required for mobile)
    if (!audio) {
      audio = new Audio(SCREAM_AUDIO);
      audio.preload = 'auto';
      audio.volume = 0.8;
      
      // Try to load audio
      try {
        await audio.load();
      } catch(e) {
        console.log("Audio preload issue:", e);
      }
    }

    // swap to verification UI
    landingWrap.style.display = 'none';
    verifyWrap.style.display = 'flex';

    // animate fake progress
    await runFakeProgress();
  });

  async function runFakeProgress(){
    let pct = 0;
    const startTime = Date.now();
    
    while (pct < 100){
      // increase pct by random small step
      const step = (Math.random() * 6) + 4; // 4..10%
      pct = Math.min(100, Math.floor(pct + step));
      progressBar.style.width = pct + '%';

      // update message every quarter
      let msgIndex = Math.floor((pct / 25));
      if (msgIndex >= verifyMessages.length) msgIndex = verifyMessages.length - 1;
      statusText.textContent = verifyMessages[msgIndex] + " " + pct + "%";

      // sleep: ramp faster near end
      const remaining = 100 - pct;
      const delay = 220 - Math.min(180, remaining*1.5);
      await sleep(delay + Math.random()*120);
    }

    // small pause then reveal
    await sleep(650 + Math.random()*700);
    revealScare();
  }

  async function revealScare(){
    // hide verification UI
    verifyWrap.style.display = 'none';

    // Ensure image is loaded
    await new Promise(resolve => {
      if (scareImg.complete) {
        resolve();
      } else {
        scareImg.onload = resolve;
        scareImg.onerror = resolve; // Continue even if image fails
      }
    });
    
    // show full-screen scare
    scareFull.style.display = 'flex';
    scareImg.style.display = 'block';
    overlayText.textContent = "Validating... completed";

    // brief animation sequence
    scareImg.style.transform = "scale(1.05)";
    await sleep(350);
    scareImg.classList.add('shake');
    await sleep(600);
    scareImg.classList.remove('shake');
    scareImg.style.transform = "scale(1)";

    // play the scream audio
    if (audio) {
      try {
        audio.currentTime = 0;
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(e => {
            console.log("Audio play blocked:", e);
            // If blocked, try again with user gesture
          });
        }
      } catch(e){ 
        console.log("Audio couldn't play:", e); 
      }
    }

    // flash overlay text then final line
    await sleep(500);
    overlayText.textContent = "You shouldn't have scanned this...";
    
    // optional extra: small flicker of zoom/pulse
    for (let i=0;i<3;i++){
      scareImg.style.transform = "scale(1.03)";
      await sleep(220);
      scareImg.style.transform = "scale(1)";
      await sleep(120);
    }

    // final persistent message
    overlayText.style.fontSize = "28px";
    overlayText.style.textShadow = "0 12px 40px rgba(0,0,0,.8)";
  }

  // ESC key to exit (for testing)
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){
      scareFull.style.display = 'none';
      landingWrap.style.display = 'flex';
      verifyWrap.style.display = 'none';
      progressBar.style.width = '0%';
      statusText.textContent = 'Initializing 0%';
      if (audio) {
        audio.pause();
        audio.currentTime = 0;
      }
    }
  });
</script>
</body>
</html>
